<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon profil — Softacess Solution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#003461;--orange:#E77F00;--orange-deep:#C46700;--cream:#F7F4EC;--cream-2:#EFEADB;
    --ink:#0E1B26;--ink-soft:#4B5A68;--line:rgba(0,52,97,0.14);
    --display:'Space Grotesk',sans-serif;--mono:'IBM Plex Mono',monospace;--sans:'Manrope',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--cream);color:var(--ink);font-family:var(--sans);min-height:100vh;}
  a{color:inherit;}
  nav{display:flex;align-items:center;justify-content:space-between;padding:20px 40px;border-bottom:1px solid var(--line);background:#fff;}
  nav a.logo{font-family:var(--display);font-weight:700;font-size:16px;color:var(--navy);text-decoration:none;}
  nav a.logo span{color:var(--orange);}
  nav .nav-right{display:flex;align-items:center;gap:20px;font-family:var(--mono);font-size:12.5px;}
  nav .nav-right a{color:var(--navy);text-decoration:none;opacity:0.8;}
  #logoutBtn{background:none;border:1px solid var(--line);border-radius:20px;padding:8px 16px;font-family:var(--mono);font-size:12px;cursor:pointer;color:var(--navy);}
  .wrap{max-width:760px;margin:0 auto;padding:48px 24px 80px;}
  .eyebrow{font-family:var(--mono);font-size:12px;color:var(--orange-deep);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:10px;}
  h1{font-family:var(--display);font-weight:700;font-size:28px;color:var(--navy);margin-bottom:8px;}
  .sub{color:var(--ink-soft);font-size:15px;margin-bottom:36px;}
  .panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:36px;box-shadow:0 20px 50px rgba(0,52,97,0.06);}
  .photo-row{display:flex;align-items:center;gap:20px;margin-bottom:30px;}
  .photo-preview{width:88px;height:88px;border-radius:50%;object-fit:cover;background:var(--cream-2);border:2px solid var(--line);}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;}
  .field label{font-family:var(--mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-soft);}
  .field input, .field textarea, .field select{
    font-family:var(--sans);font-size:14.5px;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff;width:100%;
  }
  .field textarea{resize:vertical;min-height:80px;}
  .field input:focus, .field textarea:focus, .field select:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(231,127,0,0.14);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .publish-row{display:flex;align-items:center;gap:10px;margin:24px 0;padding:14px 16px;background:var(--cream-2);border-radius:10px;}
  .publish-row label{font-family:var(--mono);font-size:12.5px;color:var(--navy);}
  .save-btn{font-family:var(--mono);font-size:13.5px;padding:14px 32px;border-radius:30px;border:none;background:var(--orange);color:#fff;cursor:pointer;transition:background .3s,transform .3s;}
  .save-btn:hover{background:var(--orange-deep);transform:translateY(-2px);}
  .save-btn:disabled{opacity:0.6;cursor:wait;}
  .status{margin-top:16px;font-family:var(--mono);font-size:13px;padding:12px;border-radius:10px;display:none;}
  .status.success{display:block;background:rgba(47,120,90,0.1);color:#2F785A;}
  .status.error{display:block;background:rgba(200,60,40,0.1);color:#C43C28;}
  .view-link{font-family:var(--mono);font-size:12.5px;color:var(--orange-deep);text-decoration:none;border-bottom:1px solid var(--orange-deep);margin-left:16px;}
  .section-label{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--orange-deep);margin:26px 0 14px;display:block;border-top:1px solid var(--line);padding-top:22px;}
  .section-label:first-of-type{border-top:none;padding-top:0;margin-top:0;}
  #loadingMsg{text-align:center;padding:80px 20px;font-family:var(--mono);color:var(--ink-soft);}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">Softacess <span>Solution</span></a>
  <div class="nav-right">
    <a href="annuaire.html">Annuaire</a>
    <button id="logoutBtn">Se déconnecter</button>
  </div>
</nav>

<div id="loadingMsg">Chargement de votre profil...</div>

<div class="wrap" id="pageContent" style="display:none;">
  <div class="eyebrow">Espace consultant</div>
  <h1>Mon profil</h1>
  <p class="sub">Ces informations apparaissent sur votre page publique dans l'annuaire. <a href="#" class="view-link" id="viewProfileLink" target="_blank">Voir ma page publique →</a></p>

  <div class="panel">
    <form id="profileForm">
      <div class="photo-row">
        <img id="photoPreview" class="photo-preview" src="" alt="Photo de profil">
        <div class="field" style="flex:1;">
          <label for="pf-photo">Photo de profil</label>
          <input type="file" id="pf-photo" accept="image/*">
        </div>
      </div>

      <span class="section-label">Identité</span>
      <div class="row2">
        <div class="field"><label for="pf-name">Nom complet</label><input type="text" id="pf-name" required></div>
        <div class="field"><label for="pf-title">Titre / zone de compétence</label><input type="text" id="pf-title" required></div>
      </div>
      <div class="field"><label for="pf-bio">Présentation courte</label><textarea id="pf-bio"></textarea></div>

      <span class="section-label">Parcours</span>
      <div class="field"><label for="pf-experience">Expériences professionnelles</label><textarea id="pf-experience" placeholder="Une expérience par ligne : Poste — Entreprise — Période"></textarea></div>
      <div class="field"><label for="pf-education">Parcours académique</label><textarea id="pf-education"></textarea></div>
      <div class="field"><label for="pf-achievements">Réalisations</label><textarea id="pf-achievements"></textarea></div>

      <span class="section-label">Compétences</span>
      <div class="field"><label for="pf-skills">Compétences / outils (séparés par des virgules)</label><input type="text" id="pf-skills" placeholder="Excel VBA, Power BI, SQL"></div>
      <div class="field"><label for="pf-languages">Langues parlées (séparées par des virgules)</label><input type="text" id="pf-languages" placeholder="Français, Anglais, Haoussa"></div>
      <div class="field"><label for="pf-interests">Centres d'intérêt (séparés par des virgules)</label><input type="text" id="pf-interests"></div>

      <span class="section-label">Localisation & contact</span>
      <div class="row2">
        <div class="field"><label for="pf-country">Pays</label><input type="text" id="pf-country" placeholder="France, Niger, Sénégal..."></div>
        <div class="field"><label for="pf-location">Ville / région (optionnel)</label><input type="text" id="pf-location"></div>
      </div>
      <div class="row2">
        <div class="field"><label for="pf-email">Email de contact public</label><input type="email" id="pf-email"></div>
        <div class="field"><label for="pf-phone">Téléphone</label><input type="tel" id="pf-phone"></div>
      </div>

      <div class="publish-row">
        <input type="checkbox" id="pf-published">
        <label for="pf-published">Publier mon profil dans l'annuaire public</label>
      </div>

      <button type="submit" class="save-btn" id="pf-save-btn">Enregistrer mon profil</button>
      <div class="status" id="pf-status"></div>
    </form>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://gxvokknynxdeaakocfuq.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4dm9ra255bnhkZWFha29jZnVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3OTM5ODgsImV4cCI6MjEwMzM2OTk4OH0.Ir1oPIAyVLPvXEFxcbQFArd2Wl0AMiN1E_8UE5VflCU";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let currentPhotoUrl = "";

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      window.location.href = 'connexion.html';
      return;
    }
    currentUser = session.user;

    const { data: profile, error } = await sb.from('consultants').select('*').eq('id', currentUser.id).maybeSingle();

    if (profile) {
      document.getElementById('pf-name').value = profile.full_name || '';
      document.getElementById('pf-title').value = profile.title || '';
      document.getElementById('pf-bio').value = profile.bio || '';
      document.getElementById('pf-experience').value = profile.experience || '';
      document.getElementById('pf-education').value = profile.education || '';
      document.getElementById('pf-achievements').value = profile.achievements || '';
      document.getElementById('pf-skills').value = profile.skills || '';
      document.getElementById('pf-languages').value = profile.languages || '';
      document.getElementById('pf-interests').value = profile.interests || '';
      document.getElementById('pf-country').value = profile.country || '';
      document.getElementById('pf-location').value = profile.location || '';
      document.getElementById('pf-email').value = profile.contact_email || currentUser.email || '';
      document.getElementById('pf-phone').value = profile.contact_phone || '';
      document.getElementById('pf-published').checked = !!profile.is_published;
      currentPhotoUrl = profile.photo_url || '';
      document.getElementById('photoPreview').src = currentPhotoUrl || 'https://via.placeholder.com/88/EFEADB/003461?text=%20';
    } else {
      document.getElementById('pf-email').value = currentUser.email || '';
      document.getElementById('photoPreview').src = 'https://via.placeholder.com/88/EFEADB/003461?text=%20';
    }

    document.getElementById('viewProfileLink').href = 'profil.html?id=' + currentUser.id;
    document.getElementById('loadingMsg').style.display = 'none';
    document.getElementById('pageContent').style.display = 'block';
  }

  document.getElementById('pf-photo').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      document.getElementById('photoPreview').src = URL.createObjectURL(file);
    }
  });

  document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('pf-save-btn');
    const statusEl = document.getElementById('pf-status');
    btn.disabled = true;
    btn.textContent = 'Enregistrement...';
    statusEl.className = 'status';

    let photoUrl = currentPhotoUrl;
    const fileInput = document.getElementById('pf-photo');
    if (fileInput.files[0]) {
      const file = fileInput.files[0];
      const ext = file.name.split('.').pop();
      const path = `${currentUser.id}/photo.${ext}`;
      const { error: uploadError } = await sb.storage.from('avatars').upload(path, file, { upsert: true });
      if (uploadError) {
        statusEl.classList.add('error');
        statusEl.textContent = "Erreur photo : " + uploadError.message;
        btn.disabled = false;
        btn.textContent = 'Enregistrer mon profil';
        return;
      }
      const { data: publicUrlData } = sb.storage.from('avatars').getPublicUrl(path);
      photoUrl = publicUrlData.publicUrl + '?t=' + Date.now();
    }

    const payload = {
      id: currentUser.id,
      full_name: document.getElementById('pf-name').value.trim(),
      title: document.getElementById('pf-title').value.trim(),
      bio: document.getElementById('pf-bio').value.trim(),
      experience: document.getElementById('pf-experience').value.trim(),
      education: document.getElementById('pf-education').value.trim(),
      achievements: document.getElementById('pf-achievements').value.trim(),
      skills: document.getElementById('pf-skills').value.trim(),
      languages: document.getElementById('pf-languages').value.trim(),
      interests: document.getElementById('pf-interests').value.trim(),
      country: document.getElementById('pf-country').value.trim(),
      location: document.getElementById('pf-location').value.trim(),
      contact_email: document.getElementById('pf-email').value.trim(),
      contact_phone: document.getElementById('pf-phone').value.trim(),
      photo_url: photoUrl,
      is_published: document.getElementById('pf-published').checked,
      updated_at: new Date().toISOString()
    };

    const { error } = await sb.from('consultants').upsert(payload);

    if (error) {
      statusEl.classList.add('error');
      statusEl.textContent = "Erreur : " + error.message;
    } else {
      statusEl.classList.add('success');
      statusEl.textContent = "Profil enregistré avec succès.";
      currentPhotoUrl = photoUrl;
    }
    btn.disabled = false;
    btn.textContent = 'Enregistrer mon profil';
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = 'connexion.html';
  });

  init();
</script>
</body>
</html>
